# Test releases and stage packages on npm using OIDC trusted publishing.
# Configure npm's trusted publisher with workflow filename npm-publish.yml.
# https://docs.npmjs.com/trusted-publishers/

name: Node.js Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm stage publish
